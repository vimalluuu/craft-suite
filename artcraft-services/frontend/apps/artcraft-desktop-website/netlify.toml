# Netlify config for desktop.getartcraft.com (Nx + Vite static page).
#
# Netlify settings used to discover this file:
#   Base directory:    frontend
#   Package directory: apps/artcraft-desktop-website (relative to the base directory)
# Manage the build command and publish directory here; leave those UI fields empty.
# Paths below are relative to the frontend workspace.

[build]
command = "bash ./apps/artcraft-desktop-website/script/netlify_build.sh"
publish = "apps/artcraft-desktop-website/dist/"

# Vite emits content-hashed files under dist/assets — safe to cache forever.
[[headers]]
for = "/assets/*"

[headers.values]
"Cache-Control" = "public, max-age=31536000, immutable"

# Single-page site: unknown paths land on the page instead of a 404.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
